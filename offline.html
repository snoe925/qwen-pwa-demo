<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes — Offline</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main style="justify-content: center; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 70vh; gap: 16px;">
    <img src="icons/icon-192.png" alt="QuickNotes" style="width: 96px; height: 96px; border-radius: 22px;">
    <h1 style="font-size: 1.4rem;">You're offline</h1>
    <p style="color: var(--text-dim); max-width: 320px; line-height: 1.6;">
      No internet connection. Previously loaded pages and your saved notes are still available.
    </p>
    <a href="./" class="btn primary" style="text-decoration: none;">Try again</a>
  </main>
</body>
</html>
